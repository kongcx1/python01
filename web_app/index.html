<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Downloader Web</title>
    <link rel="stylesheet" href="/web/styles.css?v=20260224" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Telegram Video Downloader</div>
      <div class="auth">
        <label>
          API Token
          <input id="tokenInput" placeholder="可选" />
        </label>
        <button id="saveTokenBtn" class="btn ghost">保存</button>
      </div>
    </header>

    <main class="page">
      <details class="panel">
        <summary class="panel-summary">创建任务</summary>
        <div class="form-grid">
          <label>
            任务服务器
            <input id="serverBaseInput" readonly />
          </label>
          <label>
            API ID
            <input id="apiIdInput" placeholder="30535444" />
          </label>
          <label>
            API Hash
            <input id="apiHashInput" type="password" placeholder="请填写" />
          </label>
          <label>
            频道
            <input id="channelInput" placeholder="@channel 或 t.me/xxx" />
          </label>
          <label>
            并发数
            <input id="concurrencyInput" type="number" min="1" />
          </label>
          <label>
            输出目录
            <input id="outputDirInput" readonly />
          </label>
          <label>
            自动上传
            <select id="autoUploadInput">
              <option value="">默认</option>
              <option value="true">是</option>
              <option value="false">否</option>
            </select>
          </label>
          <label>
            上传元数据
            <select id="uploadMetaInput">
              <option value="">默认</option>
              <option value="true">是</option>
              <option value="false">否</option>
            </select>
          </label>
          <label>
            SSH 用户
            <input id="sshUserInput" placeholder="ubuntu" />
          </label>
          <label class="hidden">
            PEM 路径
            <input id="pemPathInput" placeholder="/Users/huangjin/Desktop/工具源码/telegramDownload.pem" />
          </label>
          <label>
            下载根目录
            <input id="downloadRootInput" placeholder="/data/telegram_downloads" />
          </label>
          <label>
            短视频阈值(分)
            <input id="shortThresholdInput" type="number" min="0" />
          </label>
        </div>
        <div class="form-actions">
          <button id="saveConfigBtn" class="btn ghost">保存配置</button>
        </div>
        <div class="hint">当前请求地址：<span id="serverBaseHint"></span></div>
      </details>

      <details class="panel">
        <summary class="panel-summary">登录与检测视频</summary>
        <div class="status-row">
          <span>登录状态</span>
          <span id="loginStatus" class="status-pill">未知</span>
        </div>
        <div class="form-grid">
          <label>
            国家/区号
            <input id="countryCodeInput" placeholder="+86" />
          </label>
          <label>
            手机号
            <input id="phoneNumberInput" placeholder="请输入手机号" />
          </label>
          <label>
            验证码
            <input id="codeInput" placeholder="输入短信验证码" />
          </label>
          <label>
            两步验证密码
            <input id="passwordInput" type="password" placeholder="如有则填写" />
          </label>
          <label>
            每页条数
            <input id="previewLimitInput" type="number" min="1" placeholder="50" />
          </label>
        </div>
        <div class="form-actions">
          <button id="sendCodeBtn" class="btn ghost">发送验证码</button>
          <button id="loginBtn" class="btn primary">登录</button>
          <span id="loginMsg" class="hint"></span>
        </div>
      </details>

      <section class="panel">
        <div class="panel-header preview-header">
          <h2>检测结果</h2>
          <div class="preview-actions">
            <button id="previewBtn" class="btn ghost">检测视频</button>
            <div class="btn-badge-wrap">
              <button id="createTaskBtn" class="btn primary">开始下载</button>
              <button id="taskBadge" class="task-badge hidden" type="button"></button>
            </div>
          </div>
          <div class="preview-toolbar">
            <span id="selectedCountText" class="hint">已选: 0</span>
            <button id="selectAllBtn" class="btn ghost">全选当前页</button>
            <button id="clearSelectionBtn" class="btn ghost">重置选择</button>
            <button id="deleteSelectedBtn" class="btn ghost">删除已选</button>
          </div>
        </div>
        <div id="previewStatus" class="hint"></div>
        <div id="previewList" class="preview-list"></div>
        <div class="preview-pagination">
          <button id="previewPrevBtn" class="btn ghost">上一页</button>
          <span id="previewPageInfo" class="hint">第 1 页</span>
          <button id="previewNextBtn" class="btn ghost">下一页</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>下载列表</h2>
          <div class="task-header-actions">
            <span id="formMsg" class="hint task-msg"></span>
            <div class="task-summary">
              <span id="taskSummaryCount" class="hint">下载数: --</span>
              <span id="taskSummarySize" class="hint">大小: --</span>
            </div>
            <button id="deleteSelectedTasksBtn" class="btn ghost">删除所选</button>
            <button id="refreshBtn" class="btn ghost">刷新</button>
          </div>
        </div>
        <div id="taskList" class="task-table-wrap">
          <table class="task-table">
            <thead>
              <tr>
                <th class="col-check">
                  <input id="selectAllTasks" type="checkbox" />
                </th>
                <th class="col-id">ID</th>
                <th class="col-name">名称</th>
                <th class="col-type">类型</th>
                <th class="col-speed">速度</th>
                <th class="col-size">大小</th>
                <th class="col-status">状态</th>
                <th class="col-action">操作</th>
                <th class="col-time">时间</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
        <div class="preview-pagination task-pagination">
          <button id="taskPrevBtn" class="btn ghost">上一页</button>
          <span id="taskPageInfo" class="hint">第 1 页</span>
          <button id="taskNextBtn" class="btn ghost">下一页</button>
        </div>
      </section>
    </main>

    <div id="logModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>任务日志</h3>
          <button id="closeLogBtn" class="btn ghost close-x" aria-label="关闭">×</button>
        </div>
        <pre id="logContent"></pre>
      </div>
    </div>

    <div id="mediaModal" class="modal hidden">
      <div class="modal-card media-card">
        <div class="modal-header">
          <h3>预览</h3>
          <button id="closeMediaBtn" class="btn ghost">关闭</button>
        </div>
        <div id="mediaContainer" class="media-container">
          <button id="mediaPrevBtn" class="media-arrow left">‹</button>
          <button id="mediaNextBtn" class="media-arrow right">›</button>
          <div id="mediaContent"></div>
        </div>
      </div>
    </div>

    <script src="/web/app.js?v=20260706"></script>
  </body>
</html>
